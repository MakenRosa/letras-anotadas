<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letras Anotadas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-tema="escuro">

  <main id="palco" class="palco" aria-live="polite"></main>

  <header class="hud hud-topo">
    <nav id="seletor" class="seletor" aria-label="Músicas"></nav>
    <span id="contador" class="contador"></span>
  </header>

  <footer class="hud hud-base">
    <button class="nav" id="btn-musica-ant" title="Música anterior (Shift+← ou P)">&#9198;</button>
    <button class="nav" id="btn-voltar" title="Trecho anterior (←)">&#8592;</button>
    <div id="pontos" class="pontos"></div>
    <button class="nav" id="btn-avancar" title="Próximo trecho (→ ou clique)">&#8594;</button>
    <button class="nav" id="btn-musica-prox" title="Pular para a próxima música (Shift+→ ou N)">&#9197;</button>
  </footer>

  <div id="overlay" class="overlay oculto"></div>

  <!-- Opcional: renomeie letras.local.exemplo.js para letras.local.js,
       cole as letras lá dentro e descomente a linha abaixo.
  <script src="letras.local.js"></script>
  -->
  <script src="musicas.js"></script>
  <script src="app.js"></script>
</body>
</html>
